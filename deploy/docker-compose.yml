name: intelliops

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: base
  environment:
    INTELLIOPS_REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliops
      POSTGRES_PASSWORD: intelliops
      POSTGRES_DB: intelliops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliops -d intelliops"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies Alembic migrations, then exits. The four store-using
  # services wait for it (service_completed_successfully) before starting.
  migrate:
    <<: *service
    command: alembic upgrade head
    environment:
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.ingestion.app:app
      PORT: "8000"
      INTELLIOPS_TELEMETRY_MODE: prometheus
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
      # Instant-vector selector (keeps __name__+value) so ingestion also picks
      # up the Meridian validation service's error-rate metric, alongside the
      # existing demo-app cpu_usage series. Overridden here only — the default
      # in common/config.py stays cpu_usage for test stability.
      INTELLIOPS_PROMETHEUS_QUERY: '{__name__=~"cpu_usage|meridian_error_rate"}'
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  correlation:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: full
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.correlation.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
      # Demo-friendly detection: shorter warm-up/window and a lower z-threshold
      # so the injected 18->92 cpu spike reliably clears detection and surfaces
      # within a minute or two (production would run higher/stricter).
      INTELLIOPS_CORRELATION_WARMUP_SAMPLES: "8"
      INTELLIOPS_CORRELATION_WINDOW_SECONDS: "15"
      INTELLIOPS_CORRELATION_Z_THRESHOLD: "2.0"
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  rca:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.rca.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
      # --- Optional: enable the LLM explanation provider (default is the offline template) ---
      # INTELLIOPS_LLM_EXPLANATION_ENDPOINT: "https://api.openai.com/v1"
      # INTELLIOPS_LLM_EXPLANATION_MODEL: "gpt-4o-mini"
      # INTELLIOPS_LLM_EXPLANATION_API_KEY: "sk-..."
      # Or configure it live from the console's System view — no restart needed.
    ports:
      - "8003:8000"
    volumes:
      # Shared with the Meridian gateway (Task 3) so its rollback path and
      # RCA's on-disk context store see the same rca_context_path directory.
      - rca-context:/app/data/rca_context
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  action:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: full
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.action.app:app
      PORT: "8000"
      INTELLIOPS_GOVERNANCE_MODE: http
      INTELLIOPS_GOVERNANCE_URL: http://governance:8000
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  governance:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.governance.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  feedback:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.feedback.app:app
      PORT: "8000"
      INTELLIOPS_STORE_BACKEND: postgres
      INTELLIOPS_DATABASE_URL: postgresql+psycopg://intelliops:intelliops@postgres:5432/intelliops
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  demo-app:
    <<: *service
    environment:
      SERVICE_MODULE: services.demo_app.app:app
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      demo-app:
        condition: service_healthy

  read:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.read.app:app
      PORT: "8000"
    ports:
      - "8007:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Meridian sample system: stateless backend services (no DB) that mirror
  # the `read`/`demo-app` shape — inherit the anchor's redis depends_on,
  # override module + port, and use a /health healthcheck (bus-ping-free,
  # so no redis-dependency surprise). The gateway (8008) has its own
  # Dockerfile (deploy/Dockerfile.meridian) since it also builds+serves the
  # Meridian UI, and it shares the rca-context volume with rca (Task 2) so
  # /admin/deploy's deploy markers are visible to RCA's rollback scenario.
  meridian-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.meridian
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.meridian.gateway.app:app
      PORT: "8000"
      INTELLIOPS_RCA_CONTEXT_PATH: /app/data/rca_context
      # /api/ops/metrics (Task 2) queries Prometheus directly via httpx —
      # without this the gateway falls back to the localhost:9090 default,
      # which is unreachable from inside the container, and the route
      # fails soft to {"scraped": false, "services": []}.
      INTELLIOPS_PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8008:8000"
    volumes:
      - rca-context:/app/data/rca_context
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  meridian-validation:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.meridian.validation.app:app
      PORT: "8000"
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  meridian-aggregation:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.meridian.aggregation.app:app
      PORT: "8000"
    ports:
      - "8012:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  meridian-reporting:
    <<: *service
    environment:
      INTELLIOPS_REDIS_URL: redis://redis:6379
      INTELLIOPS_LOG_FORMAT: json
      SERVICE_MODULE: services.meridian.reporting.app:app
      PORT: "8000"
    ports:
      - "8013:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  kafka:
    image: bitnami/kafka:3.7
    profiles:
      - kafka
    environment:
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  # Shared between rca and (Task 3) meridian-gateway at rca_context_path.
  rca-context:
