{{/*
rbac.yaml
Scoped RBAC for the action service's real k8s remediation + sandbox pre-flight.
Rendered only when rbac.create (the live posture); dry-run needs no cluster access.

Two shapes, least privilege first:
  - rbac.sandbox=false (default): a namespaced Role in the RELEASE namespace —
    exactly what real remediation + health verification call (k8s_remediator,
    k8s_health): read/patch/scale Deployments, read ReplicaSets and Pods. The
    action service cannot touch any other namespace.
  - rbac.sandbox=true: a ClusterRole that additionally lets the sandbox rehearsal
    create/delete a THROWAWAY namespace and clone the workload into it. Namespace
    create/delete is cluster-scoped, so this cannot be a namespaced Role. Only
    enable it together with SANDBOX_MODE=k8s.
*/}}
{{- if .Values.rbac.create }}
{{- $kind := ternary "ClusterRole" "Role" .Values.rbac.sandbox }}
{{- $name := printf "%s-intelliops-action" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intelliops-action
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
rules:
  # Deployments: scale / restart (rollout restart via patch) / rollback.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "patch"{{ if .Values.rbac.sandbox }}, "create"{{ end }}]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  # Diagnostics / health.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- if .Values.rbac.sandbox }}
  # Sandbox pre-flight: create/delete a throwaway namespace + clone config/service.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ $name }}
  labels:
    {{- include "intelliops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: intelliops-action
    namespace: {{ .Release.Namespace }}
{{- end }}
