{{/*
meridian.yaml
The Meridian sample production system (4 services) — a second, richer fault
source. Each runs the shared BASE image launching its own module. Gated on
meridian.enabled; ranges over meridian.services.
*/}}
{{- if .Values.meridian.enabled }}
{{- $img := .Values.meridian.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) }}
{{- $root := . }}
{{- range .Values.meridian.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "intelliops.labels" $root | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" $root "name" .name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "intelliops.selectorLabels" (dict "root" $root "name" .name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "intelliops.selectorLabels" (dict "root" $root "name" .name) | nindent 8 }}
    spec:
      # These are stateless fault simulators with nothing to flush. The default
      # 30s grace directly delays post-remediation verification: during a rolling
      # restart status.replicas counts the surge pod, so the health check's
      # readyReplicas == replicas cannot hold until the OLD pod is gone. Measured
      # at the 30s default the predicate first went true at 30.8s; at 5s it
      # converges in ~6s, which is also what makes the demo feel immediate.
      terminationGracePeriodSeconds: {{ $root.Values.meridian.terminationGracePeriodSeconds | default 5 }}
      containers:
        - name: {{ .name }}
          image: {{ $img | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # The shared platform env. Meridian was the only workload that did not
          # mount it, so it never received INTELLIOPS_REDIS_URL and its /ready
          # was permanently 503 on a dependency it could actually reach.
          envFrom:
            - configMapRef:
                name: intelliops-env
          env:
            - name: SERVICE_MODULE
              value: {{ .module | quote }}
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "intelliops.labels" $root | nindent 4 }}
    {{- include "intelliops.selectorLabels" (dict "root" $root "name" .name) | nindent 4 }}
spec:
  {{- if and (eq .name "meridian-gateway") $root.Values.meridian.gatewayNodePort }}
  # The gateway owns /api/ops/fault, so a demo needs it reachable from the host.
  # kind-config-full.yaml already reserves this port.
  type: NodePort
  {{- end }}
  selector:
    {{- include "intelliops.selectorLabels" (dict "root" $root "name" .name) | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
      {{- if and (eq .name "meridian-gateway") $root.Values.meridian.gatewayNodePort }}
      nodePort: {{ $root.Values.meridian.gatewayNodePort }}
      {{- end }}
{{- end }}
{{- end }}
