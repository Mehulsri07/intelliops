# Opt-in LIVE posture for a real cluster. Enable with:
#   helm install intelliops deploy/k8s/platform -f deploy/k8s/platform/values-live.yaml \
#     --set-string llm.apiKey=$GROQ_API_KEY
#
# The LLM API key is NOT in this file (never commit a key). Supply it at install
# via --set-string llm.apiKey=... (the chart then creates a Secret), OR pre-create
# a Secret and set llm.apiKeySecretName to its name.
#
# This flips the metrics-arc features ON and points remediation/health at the
# real cluster + in-cluster Prometheus:
env:
  CORRELATOR_KIND: "robust"          # seasonal per-(metric,hour) baselines
  DETECTION_POLICY: "on"             # Phase 2 — detect + verify agree
  RUNBOOK_SELECTOR_MODE: "embedding" # Phase 3 — AI-computed (symptom-fit) confidence
  REMEDIATOR_MODE: "k8s"             # real pod remediation
  # Sandbox pre-flight is OFF: cloning a Deployment into a throwaway namespace
  # isn't reliable in this kind setup (ADR-029's documented limit), and a failed
  # rehearsal fails closed and blocks every remediation. Real remediation +
  # per-metric health verification still run. Flip to "k8s" once per-clone
  # cloning is supported in the target cluster.
  SANDBOX_MODE: "off"
  HEALTH_CHECK_MODE: "k8s"           # Phase 4 — verify the firing metric recovered
  # A human needs time to click Approve in the console before the action service
  # gives up and aborts:timeout. 10 minutes.
  HITL_POLL_TIMEOUT_SECONDS: "600"
  PROMETHEUS_URL: "http://prometheus:9090"
  # Ingestion polls Prometheus live. The query is a __name__ regex selector across
  # every USE+RED family the arc detects, so faults on any of them flow into a
  # Situation (not just cpu). One instant query returns all series across services.
  TELEMETRY_MODE: "prometheus"
  PROMETHEUS_QUERY: '{__name__=~"cpu_usage|memory_usage_mb|meridian_error_rate|latency_p99_ms|latency_p50_ms|queue_depth|db_pool_in_use|request_rate"}'
  # action + governance are separate pods in k8s → approvals must go over HTTP so
  # the console's "Approve" and the action gate share the same approval store.
  GOVERNANCE_MODE: "http"
  GOVERNANCE_URL: "http://governance:8000"
  # LLM explanations (Phase: AI-drafted/advisory). Groq shown; any OpenAI-compatible
  # endpoint works. The key is supplied at install (see above), never here.
  LLM_EXPLANATION_ENDPOINT: "https://api.groq.com/openai/v1"
  LLM_EXPLANATION_MODEL: "openai/gpt-oss-120b"
  # AI-authored runbooks (PR C): human clicks "Draft a runbook with AI" on a gap
  # incident → the governance author drafts a ProposedPlaybook for approval. Same
  # Groq endpoint; the key reaches the governance pod via the shared llm Secret.
  RUNBOOK_AUTHOR_MODE: "openai"
  LLM_RUNBOOK_ENDPOINT: "https://api.groq.com/openai/v1"
  LLM_RUNBOOK_MODEL: "openai/gpt-oss-120b"

# The action service needs RBAC to patch Deployments in the release namespace.
# SANDBOX_MODE is off above, so the namespaced Role is enough; set
# rbac.sandbox=true (ClusterRole) only if you also flip SANDBOX_MODE to k8s.
rbac:
  create: true
  sandbox: false
