# deploy/k8s/meridian/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-gateway
  namespace: intelliops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: meridian-gateway }
  template:
    metadata:
      labels: { app: meridian-gateway }
    spec:
      containers:
        - name: meridian-gateway
          image: intelliops-demo-app:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_MODULE, value: "services.meridian.gateway.app:app" }
            - { name: PORT, value: "8000" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: meridian-gateway
  namespace: intelliops-demo
  labels: { app: meridian-gateway }
spec:
  type: NodePort
  selector: { app: meridian-gateway }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30808
