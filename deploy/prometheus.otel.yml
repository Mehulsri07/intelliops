global:
  scrape_interval: 5s

scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app:8080"]
        labels:
          # Attach a `service` label so downstream RCA (which keys on
          # event.labels["service"]) can classify the situation and pick a
          # matching playbook. Without it, hypotheses fall to the low-confidence
          # fallback with no suggested runbook and the HITL gate never fires.
          service: demo-app

  # Meridian sample system: one job per backend service, each stamping a
  # unique `service:` label (same mechanism as demo-app above) so RCA can
  # attribute faults to the specific Meridian service that produced them.
  - job_name: meridian-gateway
    static_configs: [{ targets: ["meridian-gateway:8000"], labels: { service: meridian-gateway } }]
  - job_name: meridian-validation
    static_configs: [{ targets: ["meridian-validation:8000"], labels: { service: meridian-validation } }]
  - job_name: meridian-aggregation
    static_configs: [{ targets: ["meridian-aggregation:8000"], labels: { service: meridian-aggregation } }]
  - job_name: meridian-reporting
    static_configs: [{ targets: ["meridian-reporting:8000"], labels: { service: meridian-reporting } }]

  # --- OTLP ingress (docker-compose.otel.yml overlay) --------------------------
  # The OpenTelemetry Collector re-publishes everything it receives over OTLP on
  # this endpoint. `service` comes from the OTel service.name resource attribute
  # (promoted to a label in otel-collector-config.yml), which is the label RCA
  # keys on - so honor_labels lets it through instead of overwriting it.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
