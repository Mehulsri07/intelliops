id: scale-service
name: Scale Service Horizontally
match_rule: "hypothesis == 'resource-exhaustion'"
steps:
  - action: scale
    replicas: 2
    note: "kubectl scale deploy/{service} --replicas={target}"
hitl_mode: hitl
reversible: true
rollback_steps:
  - action: scale
    replicas: -2
    note: "kubectl scale deploy/{service} --replicas={original}"
symptoms: "high CPU or memory saturation, resource exhaustion, service thrashing under sustained load, OOM kills, throttling"
