id: rollback-deploy
name: Rollback Deployment
match_rule: "hypothesis == 'recent-deploy'"
steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deploy/{service}"
hitl_mode: hitl
reversible: true
rollback_steps:
  - action: rollback_deploy
    note: "kubectl rollout undo deploy/{service} --to-revision={prev}"
symptoms: "regression immediately following a recent deployment or release, new version misbehaving, errors starting right after a rollout"
