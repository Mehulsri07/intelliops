[project]
name = "intelliops"
version = "0.0.0"
description = "Agentic AIOps for automated incident detection, diagnosis & remediation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "kafka-python>=2.0.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
ml = ["numpy>=2", "scikit-learn>=1.9.0", "river>=0.25.0", "joblib>=1.5.3", "sentence-transformers>=3.0"]
k8s = ["kubernetes>=29"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "fakeredis>=2.37.0",
    "testcontainers[postgres]>=4.0",
    "testcontainers[kafka]>=4.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "common", "services"]
markers = [
    "postgres: tests that require a real Postgres (testcontainers + Docker)",
    "kafka: tests that require a real Kafka broker (testcontainers + Docker)",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Docs hold illustrative Python inside Markdown fences; ruff's formatter would
# rewrite those snippets and fail `ruff format --check .` in CI. Design docs are
# not source — exclude them from both lint and format.
exclude = ["docs"]

[tool.setuptools.packages.find]
include = ["common*", "services*"]
