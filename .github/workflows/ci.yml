name: CI
on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default; the publish job widens it for itself only.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra ml --extra k8s
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra ml --extra k8s
      # `postgres`-marked tests (migrations + every Postgres store) run here:
      # they start their own Postgres via testcontainers, and the runner has
      # Docker. Postgres is the store backend in every deployment, so these must
      # gate merges. Only the Kafka tests (optional bus backend) stay excluded.
      - run: uv run pytest -q -m "not kafka"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Render the chart in every posture we ship, so a template error is caught in
  # review rather than at `helm install`.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHART: deploy/k8s/platform
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint "$CHART"
      - run: helm lint "$CHART" -f "$CHART/values-live.yaml"
      - name: Render safe, live, sandbox and existing-secret postures
        run: |
          helm template t "$CHART" > /dev/null
          helm template t "$CHART" -f "$CHART/values-live.yaml" --set-string llm.apiKey=x > /dev/null
          helm template t "$CHART" --set rbac.create=true --set rbac.sandbox=true > /dev/null
          helm template t "$CHART" --set postgres.existingSecret=my-pg > /dev/null

  # --- Dependency audits -----------------------------------------------------
  # Blocking: a known vulnerability in a locked dependency fails the PR.
  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Export the locked dependency set (all extras, no dev)
        run: uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --require-hashes --disable-pip

  audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend, services/meridian/ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Audits the lockfile directly — no install needed. --omit=dev scopes it to
      # what ships to the browser: the remaining dev-only findings are the
      # braces/micromatch chain under tailwindcss 3 (build-time glob matching),
      # whose only fix is the breaking tailwindcss 4 migration.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  slim-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build base-only venv (no ml/k8s extras)
        run: |
          uv venv .slim
          VIRTUAL_ENV=.slim uv sync --frozen --no-dev --active
      - name: Every base-image service imports with zero heavy deps
        run: |
          for svc in ingestion read demo_app governance action feedback rca \
                     meridian.gateway meridian.validation meridian.aggregation meridian.reporting; do
            VIRTUAL_ENV=.slim .slim/bin/python -c "
          import importlib, sys
          importlib.import_module('services.${svc}.app')
          leaked = {'numpy','scipy','sklearn','river','joblib','kubernetes','sentence_transformers','torch','transformers'} & set(sys.modules)
          assert not leaked, f'${svc} leaked: {leaked}'
          print('OK ${svc}')" || exit 1
          done
          VIRTUAL_ENV=.slim .slim/bin/python -c "from common.stores import make_stores; print('OK make_stores on slim')" || exit 1
      - name: Grep-lint guards
        run: |
          ! grep -rEn 'numpy|scipy|sklearn|river|joblib' services/feedback/ || { echo 'feedback must not import heavy deps'; exit 1; }
          ! grep -nE '^(import|from) .*(sklearn|joblib)' services/correlation/adapters/trained_correlator.py || { echo 'sklearn/joblib must stay lazy in trained_correlator'; exit 1; }

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      # Pre-build the three compose images with a persistent layer cache (the
      # `full` target is ~4GB of torch — rebuilding it cold every run was most of
      # this job). Tags match the `image:` names in deploy/docker-compose.yml, so
      # `up --no-build` below starts exactly these.
      - uses: docker/setup-buildx-action@v3
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: base
          tags: intelliops:latest
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base
      - name: Build full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: full
          tags: intelliops:full
          load: true
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full
      - name: Build Meridian gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.meridian
          tags: intelliops-meridian:latest
          load: true
          cache-from: type=gha,scope=meridian
          cache-to: type=gha,scope=meridian
      - run: docker compose -f deploy/docker-compose.yml up -d --no-build
      - name: Wait for all services, verify readiness
        run: |
          # migrate is a one-shot with no HTTP port — assert it exited 0
          mid=$(docker compose -f deploy/docker-compose.yml ps -aq migrate)
          for attempt in $(seq 1 20); do
            state=$(docker inspect -f '{{.State.Status}}' "$mid" 2>/dev/null || echo pending)
            [ "$state" = "exited" ] && break
            [ "$attempt" -eq 20 ] && { echo "migrate never exited"; exit 1; }
            sleep 3
          done
          code=$(docker inspect -f '{{.State.ExitCode}}' "$mid")
          [ "$code" = "0" ] || { echo "migrate exited $code"; exit 1; }
          echo " ✓ migrate exited 0"
          # /ready for the 7 IntelliOps HTTP services (runs bus.ping + db_ready)
          for port in 8001 8002 8003 8004 8005 8006 8007; do
            for attempt in $(seq 1 20); do
              curl -sf "http://localhost:$port/ready" && { echo " ✓ $port /ready"; break; }
              [ "$attempt" -eq 20 ] && { echo " ✗ $port /ready never 200"; exit 1; }
              sleep 3
            done
          done
          # /health for meridian (8008/8011/8012/8013) + demo-app (8080)
          for port in 8008 8011 8012 8013 8080; do
            for attempt in $(seq 1 20); do
              curl -sf "http://localhost:$port/health" && { echo " ✓ $port /health"; break; }
              [ "$attempt" -eq 20 ] && { echo " ✗ $port /health never 200"; exit 1; }
              sleep 3
            done
          done
          # /_metrics on a platform service (self-monitoring, scraped by Prometheus)
          curl -sf "http://localhost:8007/_metrics" | grep -q intelliops_http_requests_total \
            || { echo " ✗ 8007 /_metrics missing intelliops_http_requests_total"; exit 1; }
          echo " ✓ 8007 /_metrics"
          # images must run unprivileged (one service per image)
          for svc in ingestion action meridian-gateway; do
            uid=$(docker compose -f deploy/docker-compose.yml exec -T "$svc" id -u)
            [ "$uid" != "0" ] || { echo " ✗ $svc runs as root"; exit 1; }
            echo " ✓ $svc uid=$uid"
          done
          # Logs + metrics UI: Loki ready, Grafana up with all three datasources
          # healthy, and Alloy actually shipping container logs into Loki.
          for url in http://localhost:3100/ready http://localhost:3000/api/health; do
            for attempt in $(seq 1 30); do
              curl -sf "$url" >/dev/null && { echo " ✓ $url"; break; }
              [ "$attempt" -eq 30 ] && { echo " ✗ $url never 200"; exit 1; }
              sleep 3
            done
          done
          for uid in prometheus loki intelliops-postgres; do
            curl -sf -u admin:admin "http://localhost:3000/api/datasources/uid/$uid/health" | grep -q '"status":"OK"' \
              && echo " ✓ grafana datasource $uid" \
              || { echo " ✗ grafana datasource $uid unhealthy"; exit 1; }
          done
          for attempt in $(seq 1 30); do
            curl -sf "http://localhost:3100/loki/api/v1/label/service/values" | grep -q '"governance"' \
              && { echo " ✓ loki is receiving service logs"; break; }
            [ "$attempt" -eq 30 ] && { echo " ✗ no service logs reached loki"; exit 1; }
            sleep 3
          done
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down

  # Immutable, CI-verified images: every master commit that passed the smoke
  # test is pushed to GHCR tagged with its git SHA, so a deploy can name exactly
  # what it runs and roll back to exactly what ran before. Deploy with:
  #   --set image.repository=ghcr.io/<owner>/intelliops \
  #   --set image.tag=<sha> --set image.fullTag=full-<sha> \
  #   --set console.repository=ghcr.io/<owner>/intelliops-console
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [compose-smoke, slim-boundary, helm]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: intelliops, file: deploy/Dockerfile, target: base, prefix: "", scope: base }
          - { name: intelliops, file: deploy/Dockerfile, target: full, prefix: "full-", scope: full }
          - { name: intelliops-console, file: deploy/Dockerfile.frontend, target: "", prefix: "", scope: console }
    steps:
      - uses: actions/checkout@v4
      - name: Image reference (GHCR requires a lowercase owner)
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:${{ matrix.prefix }}${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: ${{ steps.ref.outputs.image }}
          load: true
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }}
      # Scan what is about to ship. Advisory for now (exit-code 0) for the same
      # reason as the dependency audits above; set exit-code to 1 to make a
      # fixable HIGH/CRITICAL block the push. Pinned to a commit SHA (v0.36.0).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ steps.ref.outputs.image }}"
